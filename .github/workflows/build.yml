name: CI - Build / OWASP Dependency Check / Docker / Trivy

on:
  push:
    branches:
      - main
      - DEV
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    name: Build JAR
    runs-on: ubuntu-latest
    steps:
      #Récupère le code source du repo dans le runner pour build à partir de l'action checkout pour docker build
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Maven local repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('RessourceRelationnelles/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Build (skip tests)
        run: mvn -B clean package -DskipTests --file RessourceRelationnelles/pom.xml

      - name: Depcheck
        uses: dependency-check/Dependency-Check_Action@main
        env:
        # actions/setup-java@v1 changes JAVA_HOME so it needs to be reset to match the depcheck image
          JAVA_HOME: /opt/jdk
        id: Depcheck
        with:
          project: 'test'
          path: '.'
          format: 'HTML'
          out: 'reports' # this is the default, no need to specify unless you wish to override it
          args: >
            --failOnCVSS 7
            --enableRetired
            --suppression dependencycheck-suppressions.xml
        # Upload du rapport Depcheck (vulnérabilités dépendances)
      - name: Upload Dependency Check report
        uses: actions/upload-artifact@v4
        if: always()  # Important : uploade même si le job échoue
        with:
           name: Depcheck report
           path: reports/dependency-check-report.html
           
        # Display Dependency Check Results (optionnel)
      - name: Display Dependency Check Results
        if: always()
        run: cat reports/dependency-check-report.html | grep -oP 'vulnerability.*?</td>' || echo "Report generated"

      # Upload des résultats de tests
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        with:
         name: dependency-check-report
         path: RessourceRelationnelles/target/surefire-reports/
         
      - name: Upload artifact (jar)
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: RessourceRelationnelles/target/*.jar

  docker-build:
    name: Build Docker image
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build ./RessourceRelationnelles --file RessourceRelationnelles/Dockerfile --tag ressourcerelationnelles:latest

      # - name: Build an image from Dockerfile
      # run: docker build -t docker.io/my-organization/my-app:${{ github.sha }} .  ça sert à push dans docker hub, on peut le faire dans github je crois
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'ressourcerelationnelles:latest' #image-ref: 'docker.io/my-organization/my-app:${{ github.sha }}'
          format: 'table'
          exit-code: '1' #Le workflow échouera si des vulnérabilités CRITICAL ou HIGH sont trouvées
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
