name: CI - Develop (Build / OWASP / Docker / Trivy)

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build JAR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Maven local repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('RessourceRelationnelles/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Build (skip tests)
        run: mvn -B clean package -DskipTests --file RessourceRelationnelles/pom.xml

      - name: Depcheck
        uses: dependency-check/Dependency-Check_Action@main
        continue-on-error: true
        env:
          JAVA_HOME: /opt/jdk
        id: Depcheck
        with:
          project: 'test'
          path: '.'
          format: 'HTML'
          out: 'reports'
          args: >
            --failOnCVSS 7
            --enableRetired
            --suppression dependencycheck-suppressions.xml

      - name: Upload Dependency Check report
        uses: actions/upload-artifact@v4
        if: always()
        with:
           name: Depcheck report
           path: reports/dependency-check-report.html
           
      - name: Display Dependency Check Results
        if: always()
        run: cat reports/dependency-check-report.html | grep -oP 'vulnerability.*?</td>' || echo "Report generated"

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        with:
         name: dependency-check-report
         path: RessourceRelationnelles/target/surefire-reports/
         
      - name: Upload artifact (jar)
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: RessourceRelationnelles/target/*.jar

  docker-build:
    name: Build Docker image
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build ./RessourceRelationnelles --file RessourceRelationnelles/Dockerfile --tag ressourcerelationnelles:latest

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: 'ressourcerelationnelles:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
      
      - name: Connect to GCR (GitHub Container Registry)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT_PACKAGE }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/ressourcerelationnelles

      - name: Send docker image to GCR
        run : |
          docker tag ressourcerelationnelles:latest ghcr.io/lougitta/ressourcerelationnelles:develop
          docker push ghcr.io/lougitta/ressourcerelationnelles:develop
