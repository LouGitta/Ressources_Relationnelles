<div th:fragment="stat-card(quantity, description, iconClass)" class="fr-card fr-p-2w">
    <div class="fr-card__body">
        <div class="fr-card__content">
            <span th:class="'fr-icon ' + ${iconClass} + ' fr-icon--lg fr-mb-1w'" style="color: var(--text-action-high-blue-france);"></span>
            <h2 class="fr-display-xs fr-mb-0" th:text="${quantity}">0</h2>
            <p class="fr-text--sm fr-m-0" th:text="${description}">Description</p>
        </div>
    </div>
</div>
