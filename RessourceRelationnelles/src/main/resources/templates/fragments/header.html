<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <th:block th:fragment="header">
        <header role="banner" class="fr-header">
            <div class="fr-header__body">
                <div class="fr-container">
                    <div class="fr-header__body-row">
                        
                        <div class="fr-header__brand fr-enlarge-link">
                            <div class="fr-header__brand-top">
                                <div class="fr-header__logo">
                                    <a href="/home" title="Accueil - (Re)Sources Relationnelles">
                                        <p class="fr-logo">
                                            Ressources
                                            <br>relationnelles
                                        </p>
                                    </a>
                                </div>
                                <div class="fr-header__navbar">
                                    <button data-fr-opened="false" aria-controls="modal-header" title="Menu" type="button" id="button-header" class="fr-btn--menu fr-btn">Menu</button>
                                </div>
                            </div>
                            <div class="fr-header__service">
                                <a href="/home" title="Accueil - (Re)Sources Relationnelles">
                                    <p class="fr-header__service-title">(Re)Sources Relationnelles</p>
                                </a>
                                <p class="fr-header__service-tagline">Projet CESI</p>
                            </div>
                        </div>

                        <div class="fr-header__tools">
                            <div class="fr-header__tools-links">
                                <th:block th:unless="${isConnected}">
                                    <ul class="fr-links-group">
                                        <li>
                                            <a class="fr-link fr-icon-lock-line fr-link--icon-left" href="/login">Se connecter</a>
                                        </li>
                                        <li>
                                            <a class="fr-link fr-icon-account-fill fr-link--icon-left" href="/create-account">Créer un compte</a>
                                        </li>
                                    </ul>
                                </th:block>

                                <th:block th:if="${isConnected}">
                                    <ul class="fr-links-group">
                                        <li th:if="${isAdmin}">
                                            <a class="fr-link fr-icon-account-line fr-link--icon-left" href="/admin/home">ADMIN</a>
                                        </li>
                                        <li>
                                            <a class="fr-link fr-icon-account-line fr-link--icon-left" href="/app/profile">Mon profil</a>
                                        </li>
                                        <li>
                                            <a class="fr-link fr-icon-logout-box-r-line fr-link--icon-left" href="/logout">Se déconnecter</a>
                                        </li>
                                    </ul>
                                </th:block>
                            </div>
                        </div>
                        
                    </div>
                </div>
            </div>
            
            <div class="fr-header__menu fr-modal" id="modal-header" aria-labelledby="button-header">
                <div class="fr-container">
                    <button aria-controls="modal-header" title="Fermer" type="button" id="button-2168" class="fr-btn--close fr-btn">Fermer</button>
                    <div class="fr-header__menu-links"></div>
                    <nav class="fr-nav" role="navigation" aria-label="Menu principal">
                        <ul class="fr-nav__list">
                            <li class="fr-nav__item">
                                <a type="link" href="/home" class="fr-nav__link">Accueil</a>
                            </li>
                            <li class="fr-nav__item">
                                <a type="link" href="/app/ressource" class="fr-nav__link">Ressources</a>
                            </li>
                            <li class="fr-nav__item" th:if="${isConnected}">
                                <a type="link" href="/app/profile" class="fr-nav__link">Profil</a>
                            </li>
                            <li class="fr-menu__item">
                                <a type="link" href="/app/contact" class="fr-nav__link">Contact</a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </header>

        <!-- MENU -->

        <nav role="navigation" class="fr-nav" aria-label="Navigation principale">
            <div class="fr-container">
                <div class="fr-nav__inner">
                    <button class="fr-btn--menu fr-btn" aria-controls="fr-navigation-menu" aria-expanded="false">
                        Menu
                    </button>
                    <div class="fr-menu" id="fr-navigation-menu">
                        <th:block th:if="${isMobile}">
                            <ul class="fr-menu__list">
                                <li class="fr-menu__item">
                                    <a class="fr-nav__link" href="/home">Accueil</a>
                                </li>
                                <li class="fr-menu__item">
                                    <a class="fr-nav__link" href="/app/contact">Contact</a>
                                </li>
                                <li class="fr-menu__item">
                                    <a class="fr-nav__link" href="/app/cgu">CGU</a>
                                </li>
                                <li class="fr-menu__item">
                                    <a class="fr-nav__link" href="/app/legalMention">Mentions Légales</a>
                                </li>
                            </ul>
                        </th:block>
                    </div>
                </div>
            </div>
        </nav>
    </th:block>
</body>
</html>
