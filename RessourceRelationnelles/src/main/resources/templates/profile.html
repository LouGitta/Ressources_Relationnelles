<!DOCTYPE html>
<html lang="fr" data-fr-theme="light" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Mon Profil - (Re)Sources Relationnelles</title>
    <link rel="stylesheet" th:href="@{/dsfr/dsfr.min.css}">
</head>
<body>
    <header th:replace="fragments/header :: header"></header>

    <main role="main" id="content" class="fr-container fr-mt-4w fr-mb-4w">
        <h1 th:text="'Profil de ' + ${user.username}">Mon Profil</h1>

        <div class="fr-tabs">
            <ul class="fr-tabs__list" role="tablist">
                <li role="presentation"><button id="tabpanel-404" class="fr-tabs__tab" tabindex="0" role="tab" aria-selected="true" aria-controls="tabpanel-404-panel">Mes Ressources</button></li>
                <li role="presentation"><button id="tabpanel-405" class="fr-tabs__tab" tabindex="-1" role="tab" aria-selected="false" aria-controls="tabpanel-405-panel">Mes Favoris</button></li>
                <li role="presentation"><button id="tabpanel-406" class="fr-tabs__tab" tabindex="-1" role="tab" aria-selected="false" aria-controls="tabpanel-406-panel">Mes Amis</button></li>
            </ul>

            <div id="tabpanel-404-panel" class="fr-tabs__panel fr-tabs__panel--selected" role="tabpanel" aria-labelledby="tabpanel-404" tabindex="0">
                <div class="fr-table fr-table--layout-fixed">
                    <table>
                        <thead>
                            <tr>
                                <th>Titre</th>
                                <th>Statut</th>
                                <th>Date</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="res : ${myRessources}">
                                <td><a th:href="@{/app/ressource/{id}(id=${res.id})}" th:text="${res.title}">Titre</a></td>
                                <td>
                                    <span th:classappend="${res.status.name() == 'published' ? 'fr-badge--success' : (res.status.name() == 'pending' ? 'fr-badge--new' : 'fr-badge--error')}" 
                                          class="fr-badge" th:text="${res.status}">Statut</span>
                                </td>
                                <td th:text="${#temporals.format(res.createdAt, 'dd/MM/yyyy')}">Date</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div id="tabpanel-405-panel" class="fr-tabs__panel" role="tabpanel" aria-labelledby="tabpanel-405" tabindex="0">
                <div class="fr-grid-row fr-grid-row--gutters">
                    <div class="fr-col-12 fr-col-md-6" th:each="fav : ${myFavorites}">
                        <div class="fr-card fr-card--sm fr-enlarge-link">
                            <div class="fr-card__body">
                                <h4 class="fr-card__title">
                                    <a th:href="@{/app/ressource/{id}(id=${fav.ressource.id})}" th:text="${fav.ressource.title}">Titre favori</a>
                                </h4>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="tabpanel-406-panel" class="fr-tabs__panel" role="tabpanel" aria-labelledby="tabpanel-406" tabindex="0">
                <ul class="fr-btns-group">
                    <li th:each="friendship : ${myFriends}">
                        <span class="fr-btn fr-btn--secondary fr-icon-user-line fr-btn--icon-left" 
                              th:text="${friendship.user1.id == user.id ? friendship.user2.username : friendship.user1.username}">Nom de l'ami</span>
                    </li>
                </ul>
                <p th:if="${#lists.isEmpty(myFriends)}" class="fr-text--sm">Vous n'avez pas encore d'amis ajoutés.</p>
            </div>
        </div>
    </main>

    <script type="module" th:src="@{/dsfr/dsfr.module.min.js}"></script>
</body>
</html>
