<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/layoutAdmin :: layout(~{::main})}">
<body>

    <main role="main" id="content">
        <div class="fr-container fr-mt-4w fr-mb-4w">
            
            <div class="fr-grid-row fr-mb-3w">
                <div class="fr-col-12">
                    <h1 th:text="${ressource.id == null ? 'Créer une ressource' : 'Modifier / Valider la ressource'}"></h1>
                    <p class="fr-text--sm" th:if="${ressource.id != null}">
                        Auteur : <strong th:text="${ressource.user?.username}">NomAuteur</strong> | 
                        Créé le : <span th:text="${#temporals.format(ressource.createdAt, 'dd/MM/yyyy')}"></span> | 
                        Vues : <span th:text="${ressource.views}"></span>
                    </p>
                </div>
            </div>

            <form th:action="@{/admin/ressources/save}" th:object="${ressource}" method="post" class="fr-mt-2w">
                
                <input type="hidden" th:field="*{id}" />

                <div class="fr-input-group">
                    <label class="fr-label" for="title">Titre de la ressource</label>
                    <input class="fr-input" type="text" id="title" th:field="*{title}" required>
                </div>

                <div class="fr-grid-row fr-grid-row--gutters">
                    <div class="fr-col-12 fr-col-md-4">
                        <div class="fr-select-group">
                            <label class="fr-label" for="category">Catégorie</label>
                            <select class="fr-select" id="category" th:field="*{categoryId}" required>
                                <option value="" disabled>Choisir une catégorie</option>
                                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                            </select>
                        </div>
                    </div>
                    <div class="fr-col-12 fr-col-md-4">
                        <div class="fr-select-group">
                            <label class="fr-label" for="type">Format / Type</label>
                            <select class="fr-select" id="type" th:field="*{typeId}" required>
                                <option value="" disabled>Choisir un type</option>
                                <option th:each="t : ${types}" th:value="${t.id}" th:text="${t.name}"></option>
                            </select>
                        </div>
                    </div>
                    <div class="fr-col-12 fr-col-md-4">
                        <div class="fr-select-group">
                            <label class="fr-label" for="relation">Type de relation</label>
                            <select class="fr-select" id="relation" th:field="*{relationId}" required>
                                <option value="" disabled>Choisir une relation</option>
                                <option th:each="rel : ${relations}" th:value="${rel.id}" th:text="${rel.name}"></option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="fr-grid-row fr-grid-row--gutters fr-mt-2w">
                    <div class="fr-col-12 fr-col-md-6">
                        <div class="fr-select-group">
                            <label class="fr-label" for="visibility">Visibilité</label>
                            <select class="fr-select" id="visibility" th:field="*{visibility}" required>
                                <option th:each="vis : ${visibilities}" th:value="${vis}" th:text="${vis.name()}"></option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="fr-col-12 fr-col-md-6">
                        <div class="fr-select-group">
                            <label class="fr-label" for="status" style="color: var(--text-default-error); font-weight: bold;">
                                Statut de la ressource (Validation)
                            </label>
                            <select class="fr-select" id="status" th:field="*{status}" required style="border-bottom: 2px solid var(--border-action-high-error);">
                                <option th:each="stat : ${statuses}" th:value="${stat}" th:text="${stat.name()}"></option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="fr-input-group fr-mt-2w">
                    <label class="fr-label" for="content">Contenu ou description</label>
                    <textarea class="fr-input" id="content" th:field="*{content}" rows="10" required></textarea>
                </div>

                <ul class="fr-btns-group fr-btns-group--inline-md fr-mt-4w">
                    <li>
                        <button type="submit" class="fr-btn">
                            <span class="fr-icon-checkbox-circle-line fr-mr-1w" aria-hidden="true"></span>
                            Enregistrer la ressource
                        </button>
                    </li>
                    <li>
                        <a href="/admin/ressources" class="fr-btn fr-btn--secondary">Annuler</a>
                    </li>
                </ul>

            </form>
        </div>
    </main>

</body>
</html>
