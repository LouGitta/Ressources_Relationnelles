<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/layoutAdmin :: layout(~{::main})}">
<body>

    <main role="main" id="content">
        <div class="fr-container fr-mt-4w fr-mb-4w">
            <div class="fr-grid-row fr-grid-row--middle fr-mb-3w">
                <div class="fr-col-12 fr-col-md-8">
                    <h1>Gestion des Ressources</h1>
                </div>
                <div class="fr-col-12 fr-col-md-4" style="display: flex; justify-content: flex-end;">
                    <a href="/admin/ressources/new" class="fr-btn fr-icon-add-line fr-btn--icon-left">Nouvelle Ressource</a>
                </div>
            </div>
            <div class="fr-grid-row">
                <div class="fr-col-12">
                    <form action="/admin/ressources" method="get" class="fr-mb-4w fr-p-3w" style="background-color: var(--background-alt-grey);">
                        <div class="fr-grid-row fr-grid-row--gutters">
                            <div class="fr-col-12 fr-col-md-4">
                                <div class="fr-input-group">
                                    <label class="fr-label" for="title">Mot-clé dans le titre</label>
                                    <input class="fr-input" type="text" id="title" name="title" th:value="${selectedTitle}">
                                </div>
                            </div>
                            
                            <div class="fr-col-12 fr-col-md-4">
                                <div class="fr-select-group">
                                    <label class="fr-label" for="categoryId">Catégorie</label>
                                    <select class="fr-select" id="categoryId" name="categoryId">
                                        <option value="">Toutes les catégories</option>
                                        <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}" th:selected="${cat.id == selectedCategoryId}"></option>
                                    </select>
                                </div>
                            </div>

                            <div class="fr-col-12 fr-col-md-4">
                                <div class="fr-select-group">
                                    <label class="fr-label" for="typeId">Format / Type</label>
                                    <select class="fr-select" id="typeId" name="typeId">
                                        <option value="">Tous les formats</option>
                                        <option th:each="typ : ${types}" th:value="${typ.id}" th:text="${typ.name}" th:selected="${typ.id == selectedTypeId}"></option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="fr-grid-row fr-grid-row--gutters fr-grid-row--bottom">
                            
                            
                            <div class="fr-col-12 fr-col-md-4">
                                <div class="fr-select-group">
                                    <label class="fr-label" for="relationId">Type de relation</label>
                                    <select class="fr-select" id="relationId" name="relationId">
                                        <option value="">Toutes les relations</option>
                                        <option th:each="rel : ${relations}" th:value="${rel.id}" th:text="${rel.name}" th:selected="${rel.id == selectedRelationId}"></option>
                                    </select>
                                </div>
                            </div>

                            <div class="fr-col-12 fr-col-md-3">
                                <div class="fr-select-group">
                                    <label class="fr-label" for="visibility">Visibilité</label>
                                    <select class="fr-select" id="visibility" name="visibility">
                                        <option value="">Toutes</option>
                                        <option th:each="vis : ${visibilities}" th:value="${vis.name()}" th:text="${vis.name()}" th:selected="${vis == selectedVisibility}"></option>
                                    </select>
                                </div>
                            </div>

                            <div class="fr-col-12 fr-col-md-3">
                                <div class="fr-select-group">
                                    <label class="fr-label" for="status">Statut</label>
                                    <select class="fr-select" id="status" name="status">
                                        <option value="">Tous</option>
                                        <option th:each="stat : ${statuses}" th:value="${stat.name()}" th:text="${stat.name()}" th:selected="${stat == selectedStatus}"></option>
                                    </select>
                                </div>
                            </div>

                            <div class="fr-col-12 fr-col-md-2">
                                <button class="fr-btn fr-icon-search-line fr-btn--icon-left" type="submit" style="width: 100%;">
                                    Filtrer
                                </button>
                            </div>
                        </div>
                    </form>
                    <div class="fr-table fr-table--no-caption">
                        <table style="width: 100%;">
                            <caption>Liste des ressources</caption>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Titre</th>
                                    <th>Auteur</th>
                                    <th>Vues</th>
                                    <th>Type de ressource</th>
                                    <th>Catégorie</th>
                                    <th>Relation</th>
                                    <th>Visibilité</th>
                                    <th>Création</th>
                                    <th>Statut</th>
                                    <th style="text-align: right;">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="ressource : ${listRessources}">
                                    <td th:text="${ressource.id}"></td>
                                    <td th:text="${ressource.title}"></td>
                                    <td th:text="${ressource.user.username}"></td>
                                    <td th:text="${ressource.views}"></td>
                                    <td th:text="${ressource.type.name}"></td>
                                    <td th:text="${ressource.category.name}"></td>
                                    <td th:text="${ressource.relation.name}"></td>
                                    <td th:text="${ressource.visibility}"></td>
                                    <td th:text="${#temporals.format(ressource.createdAt, 'dd/MM/yyyy')}"></td>
                                    <td>
                                        <span class="fr-badge fr-badge--success" th:if="${ressource.status.name() == 'published'}">Publié</span>
                                        <span class="fr-badge fr-badge--warning" th:if="${ressource.status.name() == 'pending'}">En attente</span>
                                        <span class="fr-badge fr-badge--error" th:if="${ressource.status.name() == 'rejected'}">Rejeté</span>
                                    </td>
                                    <td style="text-align: right;">
                                        <a th:href="@{/admin/ressources/edit/{id}(id=${ressource.id})}" class="fr-btn fr-btn--tertiary-no-outline fr-icon-edit-line" title="Modifier"></a>
                                        <!-- <a th:href="@{/admin/ressources/show/{id}(id=${ressource.id})}" class="fr-btn fr-btn--tertiary-no-outline fr-icon-eye-line" title="Voir"></a> -->
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                        <div th:if="${#lists.isEmpty(listRessources)}" class="fr-alert fr-alert--info fr-mt-2w">
                            <p>Aucune ressource à afficher.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
