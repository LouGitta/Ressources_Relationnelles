<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/layoutAdmin :: layout(~{::main})}">
<body>

    <main role="main" id="content">
        <div class="fr-container fr-mt-4w fr-mb-4w">
            
            <div class="fr-grid-row fr-mb-3w">
                <div class="fr-col-12">
                    <h1 th:text="${category.id == null ? 'Ajouter une catégorie' : 'Modifier la catégorie'}"></h1>
                </div>
            </div>

            <div class="fr-grid-row">
                <div class="fr-col-12 fr-col-md-6">
                    
                    <form th:action="@{/admin/categories/save}" th:object="${category}" method="post">
                        
                        <input type="hidden" th:field="*{id}" />

                        <div class="fr-input-group">
                            <label class="fr-label" for="name">Nom</label>
                            <input class="fr-input" type="text" id="name" th:field="*{name}" required>
                        </div>

                        <ul class="fr-btns-group fr-btns-group--inline-md fr-mt-4w">
                            <li>
                                <button type="submit" class="fr-btn">
                                    <span class="fr-icon-checkbox-circle-line fr-mr-1w" aria-hidden="true"></span>
                                    Enregistrer
                                </button>
                            </li>
                            <li>
                                <a href="/admin/categories" class="fr-btn fr-btn--secondary">Annuler</a>
                            </li>
                        </ul>

                    </form>

                </div>
            </div>

        </div>
    </main>

</body>
</html>
