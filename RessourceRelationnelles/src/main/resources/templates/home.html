<!DOCTYPE html>
<html lang="fr" data-fr-theme="light" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Les Ressources - (Re)Sources Relationnelles</title>

    <link rel="stylesheet" th:href="@{/dsfr/dsfr.min.css}">
    
    <link rel="stylesheet" th:href="@{/dsfr/utility/icons/icons.min.css}">
</head>
<body>
    <header role="banner" class="fr-header">
        <div class="fr-header__body">
            <div class="fr-container">
                <div class="fr-header__body-row">
                    <div class="fr-header__brand fr-enlarge-link">
                        <div class="fr-header__brand-top">
                            <div class="fr-header__logo">
                                <a href="/" title="Accueil - Nom de l’entité (ministère, secrétariat d‘état, gouvernement)">
                                    <p class="fr-logo">
                                        Ressources
                                        <br>relationnelles
                                    </p>
                                </a>
                            </div>
                            <div class="fr-header__navbar">
                                <button data-fr-opened="false" aria-controls="modal-header" title="Menu" type="button" id="button-header" class="fr-btn--menu fr-btn">Menu</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="fr-header__menu fr-modal" id="modal-header" aria-labelledby="button-header">
            <div class="fr-container">
                <button aria-controls="modal-header" title="Fermer" type="button" id="button-2168" class="fr-btn--close fr-btn">Fermer</button>
                <div class="fr-header__menu-links">
                </div>
                <nav class="fr-nav" role="navigation" aria-label="Menu principal">
                    <ul class="fr-nav__list">
                        <li class="fr-nav__item">
                            <a type="link" href="#" class="fr-nav__link">accès direct</a>
                        </li>
                        <li class="fr-nav__item">
                            <a type="link" href="#" class="fr-nav__link">accès direct</a>
                        </li>
                        <li class="fr-nav__item">
                            <a type="link" href="#" class="fr-nav__link">accès direct</a>
                        </li>
                        <li class="fr-nav__item">
                            <a type="link" href="#" class="fr-nav__link">accès direct</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>
    <main role="main" id="content">
        <div class="fr-container fr-mt-4w fr-mb-4w">
            <h1>Catalogue des Ressources</h1>

            <div th:if="${#lists.isEmpty(ressources)}" class="fr-alert fr-alert--info">
                <h3 class="fr-alert__title">Aucune ressource</h3>
                <p>Aucune ressource n'est disponible pour le moment.</p>
            </div>

            <div class="fr-grid-row fr-grid-row--gutters">
                <div class="fr-col-12 fr-col-md-6 fr-col-lg-4" th:each="res : ${ressources}">
                    <div class="fr-card fr-enlarge-link">
                        <div class="fr-card__body">
                            <div class="fr-card__content">
                                <h3 class="fr-card__title">
                                    <a href="#" th:text="${res.title}">Titre de la ressource</a>
                                </h3>
                                <p class="fr-card__desc" th:text="${res.content}">Description de la ressource...</p>
                                <div class="fr-card__start">
                                    <p class="fr-card__detail" th:text="'Par ' + ${res.user.username}">Auteur</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script type="module" th:src="@{/dsfr/dsfr.module.min.js}"></script>
    <script type="text/javascript" nomodule th:src="@{/dsfr/dsfr.nomodule.min.js}"></script>
</body>
</html>
