<!DOCTYPE html>
<html lang="fr" data-fr-theme="light" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Les Ressources - (Re)Sources Relationnelles</title>

    <link rel="stylesheet" th:href="@{/dsfr/dsfr.min.css}">
    
    <link rel="stylesheet" th:href="@{/dsfr/utility/icons/icons.min.css}">
</head>
<body>

    <th:block th:include="fragments/header :: header"></th:block>

    <main role="main" id="content">
        <div class="fr-container fr-mt-4w fr-mb-4w">
            <h1>Ressources Récentes</h1>

            <div th:if="${#lists.isEmpty(recentRessources)}" class="fr-alert fr-alert--info">
                <h3 class="fr-alert__title">Aucune ressource</h3>
                <p>Aucune ressource n'est disponible pour le moment.</p>
            </div>

            <div class="fr-grid-row fr-grid-row--gutters">
                
                <div class="fr-col-12 fr-col-md-6 fr-col-lg-4" th:each="res : ${recentRessources}">
                    <div class="fr-card fr-enlarge-link">
                        <div class="fr-card__body">
                            <div class="fr-card__content">
                                <h3 class="fr-card__title">
                                    <a th:href="@{/app/ressources/{id}(id=${res.id})}" th:text="${res.title}">Titre de la ressource</a>
                                </h3>
                                <p class="fr-card__desc" th:text="${#strings.abbreviate(res.content, 150)}">Description de la ressource...</p>
                                
                                <div class="fr-card__start">
                                    <p class="fr-card__detail" th:text="'Publié le ' + ${#temporals.format(res.createdAt, 'dd/MM/yyyy')} + ' par ' + ${res.user.username}">Auteur et date</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:insert="~{fragments/footer :: footer}"></footer>

    <script type="module" th:src="@{/dsfr/dsfr.module.min.js}"></script>
    <script type="text/javascript" nomodule th:src="@{/dsfr/dsfr.nomodule.min.js}"></script>
</body>
</html>
