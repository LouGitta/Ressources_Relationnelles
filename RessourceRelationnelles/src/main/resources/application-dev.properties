# ==================== CONFIGURATION DÉVELOPPEMENT ====================
# Ce fichier est utilisé UNIQUEMENT en développement local
# Les credentials ici sont pour la BDD locale

# ==================== BASE DE DONNÉES ====================
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/ressources_relationnelles?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# ==================== JPA/HIBERNATE ====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true



# ==================== LOGGING ====================
logging.level.root=INFO
logging.level.cesi.RessourceRelationnelles=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ==================== SERVEUR ====================
server.port=8080
server.servlet.context-path=/
