services :
  mysql_db:
    image: mysql:8.0.45
    command: --default-authentication-plugin=caching_sha2_password
    container_name: mysql_RessourcesRelationnelles
    restart: always
    environment:
      MYSQL_DATABASE: ressources_relationnelles
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: mysql_user
      MYSQL_PASSWORD: mysql_password
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL","mysql --user=mysql_user --password=mysql_password --execute=\"SHOW DATABASES;\""]
      interval: 5s
      timeout: 5s
      retries: 20